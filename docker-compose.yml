services:
  web:
    build: .
    container_name: growvyapaar_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "127.0.0.1:8998:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: growvyapaar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suratbazar_prod}
      POSTGRES_USER: ${POSTGRES_USER:-sb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sb_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sb_user} -d ${POSTGRES_DB:-suratbazar_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Reuse the existing production DB volume (created by older "app" compose project).
  # Do NOT remove app_postgres_data — that is where listings/users live.
  postgres_data:
    external: true
    name: app_postgres_data
  media_data:
    external: true
    name: app_media_data
  static_data:
