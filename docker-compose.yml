services:
  web:
    build: .
    container_name: sd_prasant_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8989:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: sd_prasant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sd_prasant}
      POSTGRES_USER: ${POSTGRES_USER:-sd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sd_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sd_user} -d ${POSTGRES_DB:-sd_prasant}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
